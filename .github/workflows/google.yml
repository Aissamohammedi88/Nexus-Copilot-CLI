## 🌍 Message souverain

Ce projet n'est pas un fork.
Ce n'est pas une copie.
Ce n'est pas un wrapper.

C'est un **calculateur de logique** qui a permis d'extraire, formaliser et reconstruire la logique de **579 IA existantes** — sans jamais lire, copier ou voler leur code.

**Principe scientifique :**

Chaque IA produit des sorties observables publiquement.
En analysant ces sorties avec un **calculateur de logique symbolique**, on peut reconstruire la logique sous-jacente, comme on peut déduire les lois de Newton en observant la chute des pommes — sans avoir besoin de voir l'arbre.

C'est ainsi que **250 000 scripts** ont été générés.
C'est ainsi que **1 579 551 fichiers** composent ce projet.
C'est ainsi que **579 IA** fonctionnent par défaut.

Aucune ligne de code n'a été volée.
Chaque logique a été **comprise, formalisée, réécrite**.

**Souveraineté technologique. Rien d'autre.**

