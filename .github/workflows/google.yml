## 🚀 Installation

```bash
# Cloner le projet
git clone https://github.com/Aissamohammedi88/nexus-copilot-cli.git
cd nexus-copilot-cli

# Rendre le CLI exécutable
chmod +x nexus

# Lancer
./nexus
